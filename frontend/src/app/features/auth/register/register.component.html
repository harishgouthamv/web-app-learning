<div class="register-container">
  <h2>Create Account</h2>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Name
      <input type="text" formControlName="name" autocomplete="name" />
    </label>
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    <label>
      Password
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.touched && form.controls.password.hasError('minlength')) {
        <span class="hint">At least 6 characters required</span>
      }
    </label>
    @if (error) {
      <p class="error">{{ error }}</p>
    }
    <button type="submit" [disabled]="form.invalid">Create Account</button>
  </form>
  <p class="footer-link">Already have an account? <a routerLink="/login">Sign in</a></p>
</div>
