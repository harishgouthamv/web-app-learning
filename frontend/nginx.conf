server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/* to the backend container (internal Docker DNS name)
    location /api/ {
        proxy_pass         http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Angular SPA — any unmatched path serves index.html
    # so the Angular router handles /dashboard, /login, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
